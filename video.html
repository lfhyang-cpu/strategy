// helpers
function word(txt,x,y,size,t,opt={}){ // kinetic: slide up + fade, per char stagger
  X.save();X.font=F(opt.w||900,size);X.textAlign=opt.align||'left';X.textBaseline='alphabetic';
  const chars=[...txt];let cx=x; if(X.textAlign==='center'){cx=x-X.measureText(txt).width/2;X.textAlign='left'}
  chars.forEach((ch,i)=>{const k=ease((t-i*0.035)/0.45);X.globalAlpha=k;X.fillStyle=opt.c||INK;
    X.fillText(ch,cx,y+(1-k)*size*0.6);cx+=X.measureText(ch).width});
  X.restore();
}
function strokePath(pts,t,color,wd){ // progressive polyline
  if(pts.length<2)return;let L=0,seg=[];for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);L+=d}
  let left=L*clamp(t);X.save();X.strokeStyle=color;X.lineWidth=wd;X.lineCap='round';X.lineJoin='round';X.beginPath();X.moveTo(...pts[0]);
  for(let i=1;i<pts.length&&left>0;i++){const s=seg[i-1];const r=Math.min(1,left/s);X.lineTo(pts[i-1][0]+(pts[i][0]-pts[i-1][0])*r,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*r);left-=s}
  X.stroke();X.restore();
}
function fish(cx,cy,s,t){ // line-art monkfish (아귀) built from sampled curves
  const pts=[];const N=120;
  for(let i=0;i<=N;i++){const a=i/N*Math.PI*2;const r=1+0.35*Math.cos(a)*(Math.cos(a)>0?1:0.4);
    pts.push([cx+Math.cos(a)*170*s*r,cy+Math.sin(a)*95*s*(Math.cos(a)>0?1.05:0.7)])}
  strokePath(pts,t*1.3,LN,3);
  // tail
  strokePath([[cx-230*s,cy],[cx-330*s,cy-70*s],[cx-310*s,cy],[cx-330*s,cy+70*s],[cx-230*s,cy]],t*1.6-0.4,LN,3);
  // mouth + teeth
  const m=[];for(let i=0;i<=10;i++){m.push([cx+120*s+i*12*s,cy+20*s+(i%2?14:0)*s])}strokePath(m,t*1.6-0.5,AC,3);
  // lure
  strokePath([[cx+60*s,cy-80*s],[cx+120*s,cy-170*s],[cx+190*s,cy-150*s]],t*1.6-0.7,LN,3);
  if(t>0.9){X.save();X.globalAlpha=clamp((t-0.9)*8);X.fillStyle=AC;X.beginPath();X.arc(cx+195*s,cy-148*s,9*s,0,7);X.fill();
    X.beginPath();X.arc(cx+90*s,cy-25*s,7*s,0,7);X.fillStyle=INK;X.fill();X.restore()}
}
function grid(){X.save();X.strokeStyle='rgba(201,185,154,.07)';X.lineWidth=1;for(let x=0;x<W;x+=64){X.beginPath();X.moveTo(x,0);X.lineTo(x,H);X.stroke()}for(let y=0;y<H;y+=64){X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}X.restore()}
function tag(txt,t){X.save();X.globalAlpha=ease(t*3);X.font=F(700,18);X.fillStyle=AC;X.fillText(txt,80,90);X.strokeStyle=AC;X.lineWidth=2;X.beginPath();X.moveTo(80,104);X.lineTo(80+300*ease(t*2),104);X.stroke();X.restore()}
function counter(v0,v1,t,dec){return (v0+(v1-v0)*ease(t)).toFixed(dec)}
// scenes: (local time sec, duration)
const scenes=[
 (s,d)=>{const t=s/d;fish(860,380,1.05,s/3.5);tag('INSAENG AGUJJIM · BRAND ROADMAP',t);

 (s,d)=>{const t=s/d;tag('02 · 하지만 바닥이 약하다',t);
   const bx=80,by=600,bw=70,mxh=260;hist.forEach((v,i)=>{const k=ease((s-i*0.15)/1.2);const h=v/39*mxh*k;const x=bx+i*(bw+14);
     X.save();X.strokeStyle=i<2?AC:LN;X.lineWidth=3;X.strokeRect(x,by-h,bw,h);if(i<2){X.fillStyle='rgba(228,87,46,.18)';X.fillRect(x,by-h,bw,h)}

   word('10곳 중 3곳',800,300,64,s-1);word('월 3천만 원 미만',800,360,30,s-1.6,{w:400,c:LN});
   word('신규 매장',800,470,34,s-5,{w:700,c:LN});word('-40%',800,570,110,s-5.4,{c:AC});word('2026 오픈 vs 2023 오픈',800,615,22,s-6.5,{w:400,c:MUT});},
 (s,d)=>{const t=s/d;tag('03 · 점검 점수 ≠ 매출',t);
   const x0=80,x1=700,y0=620,y1=180;X.save();X.strokeStyle='rgba(201,185,154,.3)';X.strokeRect(x0,y1,x1-x0,y0-y1);X.restore();
   scatter.forEach((p,i)=>{const k=clamp((s*60-i)/10);if(k<=0)return;const x=x0+(p[0]-50)/50*(x1-x0),y=y0-Math.min(p[1],12000)/12000*(y0-y1);
     X.save();X.globalAlpha=k;X.strokeStyle=LN;X.lineWidth=1.5;X.beginPath();X.arc(x,y,5,0,7);X.stroke();X.restore()});
   X.save();X.font=F(400,15);X.fillStyle=MUT;X.fillText('KMS 점검 점수 →',x1-130,y0+26);X.fillText('↑ 월평균 매출',x0,y1-12);X.restore();
   strokePath([[x0,420],[x1,430]],(s-4)/1.2,AC,3);
   word('r = -0.07',790,350,92,s-3);word('점검표가 성과를',790,450,38,s-5.5,{w:700,c:LN});word('움직이지 못한다',790,500,38,s-6,{w:700,c:LN});},
 (s,d)=>{const t=s/d;tag('04 · 결론',t);
   word('지금은',80,250,56,s-0.2,{w:700,c:LN});word('주 브랜드 집중.',80,350,92,s-0.6,{c:AC});
   const ys=500;strokePath([[80,ys],[1200,ys]],(s-3)/2,LN,3);
   [['0–6개월','하위 매장 회생',80],['6–12개월','출점 기준 강화 · 점검표 개편',440],['12개월+','숍인숍 검증 후 확장',860]].forEach((m,i)=>{
     const k=clamp((s-3.5-i*1.4)/0.6);if(k<=0)return;X.save();X.globalAlpha=k;X.fillStyle=AC;X.beginPath();X.arc(m[2]+8,ys,8,0,7);X.fill();X.restore();
     word(m[0],m[2],ys+50,22,s-3.6-i*1.4,{w:700,c:AC});word(m[1],m[2],ys+88,26,s-3.8-i*1.4,{w:700})});},
 (s,d)=>{const t=s/d;tag('05 · 세컨브랜드 후보',t);
   [['1','점심 1인 해물덮밥',' 낮 시간대 공백을 메운다',80],['2','매운 등갈비찜',' 수산 시세 위험을 나눈다',660]].forEach((c,i)=>{
     const x=c[3],y=170,w=540,h=200,k=(s-i*0.8)/1.5;strokePath([[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y]],k,i?LN:AC,3);
     word(c[0],x+30,y+90,64,s-0.5-i*0.8,{c:i?LN:AC});word(c[1],x+100,y+85,36,s-0.7-i*0.8);word(c[2],x+100,y+135,22,s-1-i*0.8,{w:400,c:LN})});

     const pts=[];for(let a=0;a<=60;a++){pts.push([cx+Math.cos(a/60*6.283-1.57)*44,cy+Math.sin(a/60*6.283-1.57)*44])}strokePath(pts,k,AC,3);
     word('관문 '+(i+1),cx,cy+10,22,s-3.3-i*0.6,{w:700,align:'center'});word(g,cx,cy+80,22,s-3.5-i*0.6,{w:400,align:'center',c:LN})});

     fish(640,300,0.55,(s-d+2.6)/1.5);word('통과하면, 그때 확장.',640,520,54,s-d+2.2,{align:'center'});word('인생아구찜 브랜드 전략 로드맵',640,575,22,s-d+1.6,{w:400,align:'center',c:LN})}}

let bufs=[],durs=[],starts=[],ctx,dest,t0=0,running=false;const GAP=0.25,TAIL=1.2;
async function load(){ctx=new (window.AudioContext||window.webkitAudioContext)();dest=ctx.createMediaStreamDestination();
  bufs=await Promise.all([1,2,3,4,5,6].map(i=>fetch('s'+i+'.wav').then(r=>r.arrayBuffer()).then(b=>ctx.decodeAudioData(b))));
  durs=bufs.map((b,i)=>b.duration+GAP+(i==5?TAIL:0));let a=0.4;starts=durs.map(d=>{const s=a;a+=d;return s});return a}
function frame(){if(!running)return;const now=ctx.currentTime-t0;X.fillStyle=BG;X.fillRect(0,0,W,H);grid();
  let idx=starts.length-1;for(let i=0;i<starts.length;i++){if(now<starts[i]+durs[i]){idx=i;break}}
  const ls=now-starts[idx];if(ls>=0)scenes[idx](ls,durs[idx]);
  // scene transition wipe
  if(ls<0.35&&idx>0){X.save();X.fillStyle=AC;X.fillRect(0,0,W*(1-ease(ls/0.35)),4);X.restore()}
  X.save();X.fillStyle=AC;X.fillRect(0,H-4,W*clamp(now/(starts[5]+durs[5])),4);X.restore();
  if(now>starts[5]+durs[5]){running=false;tick&&tick.terminate();onEnd&&onEnd();return}}
// 워커 타이머: 탭이 백그라운드여도 30fps로 그린다
let tick=null;function startTicker(){tick=new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),33)'],{type:'text/javascript'})));tick.onmessage=frame}
let onEnd=null;
async function start(record){document.getElementById('st').textContent='불러오는 중…';const total=await load();
  let rec,chunks=[];if(record){const vs=C.captureStream(30);const ms=new MediaStream([...vs.getVideoTracks(),...dest.stream.getAudioTracks()]);
    rec=new MediaRecorder(ms,{mimeType:MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')?'video/webm;codecs=vp9,opus':'video/webm',videoBitsPerSecond:6e6});
    rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.start(500)}
  t0=ctx.currentTime;bufs.forEach((b,i)=>{const src=ctx.createBufferSource();src.buffer=b;src.connect(ctx.destination);src.connect(dest);src.start(t0+starts[i])});
  running=true;document.getElementById('st').textContent=record?'녹화 중… ('+total.toFixed(1)+'초)':'재생 중';
  onEnd=()=>{if(!record){document.getElementById('st').textContent='끝';return}rec.onstop=async()=>{const blob=new Blob(chunks,{type:'video/webm'});
     document.getElementById('st').textContent='저장 중… '+(blob.size/1e6).toFixed(1)+'MB';
     try{const r=await fetch('/upload',{method:'POST',body:blob});document.getElementById('st').textContent='저장 완료: '+await r.text()+' '+(blob.size/1e6).toFixed(1)+'MB';window.__done=true}
     catch(e){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='인생아구찜_브랜드전략_1분.webm';a.click();window.__done=true}};setTimeout(()=>rec.stop(),300)};
  startTicker()}
document.getElementById('play').onclick=()=>start(false);document.getElementById('rec').onclick=()=>start(true);
// poster
